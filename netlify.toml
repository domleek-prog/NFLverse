[build]
  publish = "."
  functions = "netlify/functions"

# Global fetch needs Node 18+; older sites still default to 16.
[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
