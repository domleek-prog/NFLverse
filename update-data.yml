name: Update NFL data

on:
  schedule:
    # 11:00 UTC every Tuesday — midday during British Summer Time, 11am in
    # winter. GitHub cron has no daylight saving, so this drifts by an hour
    # in November. Both are comfortably after Monday night football.
    - cron: '0 11 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and trim
        run: node scripts/fetch-nfl.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No change to the data — nothing to commit."
            exit 0
          fi
          git add data/
          git commit -m "Data refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
